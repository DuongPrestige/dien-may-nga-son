name: Database backup

# Daily encrypted pg_dump of the production database.
# The repository is public and anyone signed in to GitHub can download its
# artifacts, so the dump is encrypted to an OpenPGP public key before upload.
# Only the offline private key can decrypt it. Never upload an unencrypted dump.

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required configuration
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GPG_PUBLIC_KEY: ${{ vars.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_GPG_PUBLIC_KEY" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL secret and the BACKUP_GPG_PUBLIC_KEY variable."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_GPG_PUBLIC_KEY: ${{ vars.BACKUP_GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$BACKUP_GPG_PUBLIC_KEY" | gpg --batch --import
          RECIPIENT="$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$RECIPIENT" ]; then
            echo "::error::BACKUP_GPG_PUBLIC_KEY is not a valid OpenPGP public key."
            exit 1
          fi
          FILE="dien-may-nga-son-$(date -u +%Y%m%d-%H%M).dump"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner --no-privileges \
            --schema=public "$BACKUP_DATABASE_URL" --file="$FILE"
          gpg --batch --yes --trust-model always --encrypt --recipient "$RECIPIENT" \
            --output "$FILE.gpg" "$FILE"
          shred -u "$FILE"
          echo "BACKUP_FILE=$FILE.gpg" >> "$GITHUB_ENV"
          ls -lh "$FILE.gpg"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
